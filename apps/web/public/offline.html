<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FlashFacts Fact Jumper — Offline Fast Runner</title>
  <style>
    :root {
      --bg: #FAF9F6;
      --surface: #FFFFFF;
      --surface-muted: #F3F4F6;
      --border: #E5E7EB;
      --text: #202124;
      --text-muted: #5F6368;
      --brand: #2457C5;
      --brand-hover: #1b44a1;
      --success: #0F766E;
      --accent-gold: #B45309;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 16px;
      overflow-x: hidden;
    }
    .header-bar {
      width: 100%;
      max-width: 900px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 16px;
    }
    .brand-title {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      padding: 4px 10px;
      border-radius: 9999px;
      background: rgba(16, 185, 129, 0.12);
      color: var(--success);
      border: 1px solid rgba(16, 185, 129, 0.3);
      font-weight: 600;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    #onlineBanner {
      display: none;
      width: 100%;
      max-width: 900px;
      background: #10B981;
      color: #FFFFFF;
      padding: 12px 20px;
      border-radius: 12px;
      margin-bottom: 16px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      animation: slideDown 0.3s ease-out;
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .btn-return {
      background: #FFFFFF;
      color: #065F46;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-return:hover {
      background: #F0FDF4;
    }
    .game-card {
      width: 100%;
      max-width: 900px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
      position: relative;
    }
    .stats-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.85rem;
    }
    .score-group {
      display: flex;
      gap: 16px;
    }
    .score-item strong {
      font-size: 1.1rem;
      color: var(--brand);
    }
    .canvas-container {
      position: relative;
      width: 100%;
      aspect-ratio: 840 / 320;
      background: #F8FAFC;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      touch-action: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }
    .controls-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .action-btn {
      background: var(--surface-muted);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      transition: all 0.15s ease;
    }
    .action-btn:hover {
      background: var(--border);
    }
    .btn-touch {
      flex: 1;
      padding: 14px;
      font-size: 0.95rem;
      text-align: center;
      justify-content: center;
    }
    .btn-touch.active-duck {
      background: var(--brand);
      color: #FFFFFF;
      border-color: var(--brand);
    }
    .instructions {
      margin-top: 16px;
      font-size: 0.78rem;
      color: var(--text-muted);
      text-align: center;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
  </style>
</head>
<body>

  <!-- Online Restored Banner -->
  <div id="onlineBanner">
    <div style="display: flex; align-items: center; gap: 8px;">
      <span style="font-size: 1.2rem;">🌐</span>
      <span><strong>Internet Restored!</strong> FlashFacts online services are reachable again.</span>
    </div>
    <div style="display: flex; gap: 8px;">
      <button class="btn-return" onclick="window.location.href='/'">Return to FlashFacts</button>
      <button class="btn-return" style="background: rgba(0,0,0,0.15); color: #fff;" onclick="dismissOnlineBanner()">Keep Playing</button>
    </div>
  </div>

  <!-- Header -->
  <div class="header-bar">
    <div class="brand-title">
      <span>⚡ FlashFacts</span>
      <span style="font-weight: 400; color: var(--text-muted); font-size: 0.9rem;">/ Fact Jumper</span>
    </div>
    <div class="status-badge" id="offlineBadge">
      <span class="status-dot"></span>
      <span id="badgeText">Offline Fast Runner</span>
    </div>
  </div>

  <!-- Game Card -->
  <div class="game-card">
    <div class="stats-row">
      <div>
        <span id="speedIndicator" style="color: var(--text-muted); font-weight: 600;">SPEED: 1.0x</span>
      </div>
      <div class="score-group">
        <span class="score-item">SCORE: <strong id="scoreVal">0</strong></span>
        <span class="score-item">BEST: <strong id="highScoreVal" style="color: var(--accent-gold);">0</strong></span>
      </div>
    </div>

    <!-- Canvas Frame -->
    <div class="canvas-container" id="canvasContainer">
      <canvas id="gameCanvas" width="840" height="320"></canvas>
    </div>

    <!-- Touch / Keyboard Controls -->
    <div class="controls-row">
      <div style="display: flex; gap: 8px; flex: 1;">
        <button class="action-btn btn-touch" id="jumpBtn" style="background: var(--brand); color: #fff; border-color: var(--brand);">▲ JUMP (Space / Tap)</button>
        <button class="action-btn btn-touch" id="duckBtn">▼ DUCK (Down / Drag)</button>
      </div>
      <div style="display: flex; gap: 8px;">
        <button class="action-btn" id="soundBtn" onclick="toggleSound()">🔊 Sound: ON</button>
        <button class="action-btn" id="restartBtn" onclick="startGame()">↻ Restart</button>
      </div>
    </div>
  </div>

  <div class="instructions">
    Jump over ground hurdles & books (Space / ↑) · Duck under flying birds (↓) · Progressive Speed · Local Persistence
  </div>

  <script>
    // --- 1. Sound Synthesis (Web Audio API - 100% Offline) ---
    let soundEnabled = true;
    let audioCtx = null;
    function playTone(type) {
      if (!soundEnabled) return;
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!audioCtx) audioCtx = new AudioContextClass();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'jump') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.exponentialRampToValueAtTime(640, now + 0.08);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
          osc.start(now);
          osc.stop(now + 0.08);
        } else if (type === 'duck') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(240, now);
          osc.frequency.exponentialRampToValueAtTime(140, now + 0.08);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
          osc.start(now);
          osc.stop(now + 0.08);
        } else if (type === 'milestone') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.08);
          osc.frequency.setValueAtTime(783.99, now + 0.16);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
          osc.start(now);
          osc.stop(now + 0.3);
        } else if (type === 'crash') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(160, now);
          osc.frequency.exponentialRampToValueAtTime(50, now + 0.18);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.18);
          osc.start(now);
          osc.stop(now + 0.18);
        }
      } catch (e) {}
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById('soundBtn').textContent = soundEnabled ? '🔊 Sound: ON' : '🔇 Sound: OFF';
    }

    // --- 2. Stickman Runner Game Logic ---
    const STORAGE_KEY_HIGH_SCORE = "flashfacts_fact_jumper_highscore";
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreVal = document.getElementById('scoreVal');
    const highScoreVal = document.getElementById('highScoreVal');
    const speedIndicator = document.getElementById('speedIndicator');

    // Single source of truth coordinates matching main game
    const GAME_CANVAS_WIDTH = 840;
    const GAME_CANVAS_HEIGHT = 320;
    const GAME_GROUND_OFFSET = 40;
    const GAME_GROUND_Y = GAME_CANVAS_HEIGHT - GAME_GROUND_OFFSET; // Exactly 280

    let highScore = 0;
    try {
      const stored = localStorage.getItem(STORAGE_KEY_HIGH_SCORE);
      if (stored) highScore = parseInt(stored, 10) || 0;
    } catch (e) {}
    highScoreVal.textContent = highScore;

    let score = 0;
    let gameState = "RUNNING";
    const INITIAL_SPEED = 4.8;
    const MAX_SPEED = 9.5;
    const ACCELERATION = 0.0035;
    const GRAVITY = 0.60;
    const JUMP_IMPULSE = -10.2;
    const MIN_GAP = 340;
    let speed = INITIAL_SPEED;
    let distance = 0;
    let lastFactMilestone = 0;

    const player = {
      x: 80,
      y: GAME_GROUND_Y,
      width: 24,
      height: 52,
      vy: 0,
      isGrounded: true,
      isDucking: false,
      runFrame: 0
    };

    let obstacles = [];
    let particles = [];
    let nextSpawnDistance = 320;
    let animFrame = null;
    let lastTime = performance.now();

    // High-DPI Canvas Scaling with Ground Alignment
    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = GAME_CANVAS_WIDTH * dpr;
      canvas.height = GAME_CANVAS_HEIGHT * dpr;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.scale(dpr, dpr);
      if (player.isGrounded) {
        player.y = GAME_GROUND_Y;
        player.vy = 0;
      }
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function startGame() {
      score = 0;
      speed = INITIAL_SPEED;
      distance = 0;
      lastFactMilestone = 0;
      obstacles = [];
      particles = [];
      nextSpawnDistance = 320;

      // Firmly anchor player to ground
      player.x = 80;
      player.y = GAME_GROUND_Y;
      player.vy = 0;
      player.isGrounded = true;
      player.isDucking = false;
      document.getElementById('duckBtn').classList.remove('active-duck');

      gameState = "RUNNING";
      scoreVal.textContent = '0';
      speedIndicator.textContent = 'SPEED: 1.0x';
      lastTime = performance.now();
    }

    function triggerJump() {
      if (gameState === "GAMEOVER") {
        startGame();
        return;
      }
      if (player.isGrounded && !player.isDucking) {
        player.vy = JUMP_IMPULSE;
        player.isGrounded = false;
        playTone('jump');
        for (let i = 0; i < 5; i++) {
          particles.push({
            x: player.x + 8,
            y: GAME_GROUND_Y,
            vx: -(Math.random() * 2 + 1),
            vy: -(Math.random() * 2),
            alpha: 0.7,
            size: Math.random() * 3 + 2,
            color: '#94A3B8'
          });
        }
      }
    }

    function setDuck(ducking) {
      if (gameState !== "RUNNING") return;
      if (ducking && !player.isDucking) {
        playTone('duck');
        document.getElementById('duckBtn').classList.add('active-duck');
      } else if (!ducking && player.isDucking) {
        document.getElementById('duckBtn').classList.remove('active-duck');
      }
      player.isDucking = ducking;
    }

    // Keyboard controls
    window.addEventListener('keydown', (e) => {
      if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) {
        e.preventDefault();
        if (!e.repeat) triggerJump();
      } else if (['ArrowDown', 'KeyS'].includes(e.code)) {
        e.preventDefault();
        setDuck(true);
      } else if (e.code === 'KeyR' && gameState === 'GAMEOVER') {
        startGame();
      }
    });
    window.addEventListener('keyup', (e) => {
      if (['ArrowDown', 'KeyS'].includes(e.code)) {
        setDuck(false);
      }
    });

    // Touch / Button listeners
    document.getElementById('jumpBtn').addEventListener('pointerdown', (e) => {
      e.preventDefault();
      triggerJump();
    });
    const duckBtn = document.getElementById('duckBtn');
    duckBtn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      setDuck(true);
    });
    duckBtn.addEventListener('pointerup', () => setDuck(false));
    duckBtn.addEventListener('pointercancel', () => setDuck(false));
    duckBtn.addEventListener('pointerleave', () => setDuck(false));

    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if (gameState === "GAMEOVER") {
        startGame();
        return;
      }
      const rect = canvas.getBoundingClientRect();
      const clickY = e.clientY - rect.top;
      if (clickY > rect.height * 0.65) {
        setDuck(true);
      } else {
        triggerJump();
      }
    });
    canvas.addEventListener('pointerup', () => setDuck(false));
    canvas.addEventListener('pointercancel', () => setDuck(false));

    // Stickman Drawing firmly aligned to player.y
    function drawStickman(p, time, dist) {
      ctx.save();
      ctx.strokeStyle = '#0F172A';
      ctx.fillStyle = '#0F172A';
      ctx.lineWidth = 3.2;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      const isRunning = gameState === "RUNNING" && p.isGrounded && !p.isDucking;
      const isJumping = !p.isGrounded;
      const isDucking = p.isDucking && p.isGrounded;

      if (isDucking) {
        // Ducking pose
        const headX = p.x + 22;
        const headY = p.y - 17;
        const neckX = p.x + 15;
        const neckY = p.y - 14;
        const hipX = p.x - 6;
        const hipY = p.y - 9;

        ctx.beginPath();
        ctx.arc(headX, headY, 6.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(neckX, neckY);
        ctx.lineTo(hipX, hipY);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(hipX, hipY);
        ctx.lineTo(hipX + 16, p.y - 4);
        ctx.lineTo(hipX + 30, p.y - 1);
        ctx.moveTo(hipX, hipY);
        ctx.lineTo(hipX - 10, p.y - 6);
        ctx.lineTo(hipX - 18, p.y - 1);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(neckX, neckY);
        ctx.lineTo(neckX + 10, p.y - 8);
        ctx.lineTo(neckX + 24, p.y - 5);
        ctx.stroke();
      } else if (isJumping) {
        // Jump pose
        const headX = p.x + 10;
        const headY = p.y - 45;
        const neckX = p.x + 10;
        const neckY = p.y - 38;
        const hipX = p.x + 7;
        const hipY = p.y - 20;

        ctx.beginPath();
        ctx.arc(headX, headY, 7, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(neckX, neckY);
        ctx.lineTo(hipX, hipY);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(neckX, neckY + 4);
        ctx.lineTo(neckX - 8, neckY - 10);
        ctx.lineTo(neckX - 12, neckY - 18);
        ctx.moveTo(neckX, neckY + 4);
        ctx.lineTo(neckX + 12, neckY - 8);
        ctx.lineTo(neckX + 16, neckY - 16);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(hipX, hipY);
        ctx.lineTo(hipX - 8, hipY + 12);
        ctx.lineTo(hipX + 2, hipY + 18);
        ctx.moveTo(hipX, hipY);
        ctx.lineTo(hipX + 8, hipY + 10);
        ctx.lineTo(hipX + 14, hipY + 16);
        ctx.stroke();
      } else {
        // Running pose
        const runCycle = isRunning ? dist * 0.16 : 0;
        const headBob = isRunning ? Math.abs(Math.sin(runCycle)) * 3 : 0;

        const headX = p.x + 10;
        const headY = p.y - 45 + headBob;
        const neckX = p.x + 10;
        const neckY = p.y - 38 + headBob;
        const hipX = p.x + 9;
        const hipY = p.y - 20 + headBob;

        ctx.beginPath();
        ctx.arc(headX, headY, 7, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(neckX, neckY);
        ctx.lineTo(hipX, hipY);
        ctx.stroke();

        const legAngle1 = isRunning ? Math.sin(runCycle) * 0.7 : 0.1;
        const legAngle2 = isRunning ? Math.sin(runCycle + Math.PI) * 0.7 : -0.1;

        const knee1X = hipX + Math.sin(legAngle1) * 12;
        const knee1Y = hipY + Math.cos(legAngle1) * 11;
        const foot1X = knee1X + Math.sin(legAngle1 + 0.3) * 11;
        const foot1Y = Math.min(p.y, knee1Y + Math.cos(legAngle1 + 0.3) * 10);

        ctx.beginPath();
        ctx.moveTo(hipX, hipY);
        ctx.lineTo(knee1X, knee1Y);
        ctx.lineTo(foot1X, foot1Y);
        ctx.stroke();

        const knee2X = hipX + Math.sin(legAngle2) * 12;
        const knee2Y = hipY + Math.cos(legAngle2) * 11;
        const foot2X = knee2X + Math.sin(legAngle2 + 0.3) * 11;
        const foot2Y = Math.min(p.y, knee2Y + Math.cos(legAngle2 + 0.3) * 10);

        ctx.beginPath();
        ctx.moveTo(hipX, hipY);
        ctx.lineTo(knee2X, knee2Y);
        ctx.lineTo(foot2X, foot2Y);
        ctx.stroke();

        const armAngle1 = isRunning ? Math.cos(runCycle) * 0.65 : -0.2;
        const armAngle2 = isRunning ? Math.cos(runCycle + Math.PI) * 0.65 : 0.2;

        ctx.beginPath();
        ctx.moveTo(neckX, neckY + 4);
        ctx.lineTo(neckX + Math.sin(armAngle1) * 10, neckY + 4 + Math.cos(armAngle1) * 9);
        ctx.lineTo(neckX + Math.sin(armAngle1 + 0.5) * 18, neckY + 4 + Math.cos(armAngle1 + 0.5) * 16);
        ctx.moveTo(neckX, neckY + 4);
        ctx.lineTo(neckX + Math.sin(armAngle2) * 10, neckY + 4 + Math.cos(armAngle2) * 9);
        ctx.lineTo(neckX + Math.sin(armAngle2 + 0.5) * 18, neckY + 4 + Math.cos(armAngle2 + 0.5) * 16);
        ctx.stroke();
      }
      ctx.restore();
    }

    // Bird Drawing with 2-Frame Flapping Wings
    function drawBird(obs, time) {
      ctx.save();
      ctx.fillStyle = "#0F172A";
      ctx.strokeStyle = "#0F172A";
      ctx.lineWidth = 2.2;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      const bx = obs.x;
      const by = obs.y;
      const flapFrame = Math.floor(time / 140) % 2;

      // Body
      ctx.beginPath();
      ctx.moveTo(bx + 8, by + 11);
      ctx.lineTo(bx + 26, by + 9);
      ctx.lineTo(bx + 32, by + 11);
      ctx.lineTo(bx + 24, by + 16);
      ctx.lineTo(bx + 11, by + 15);
      ctx.closePath();
      ctx.fill();

      // Beak pointing left
      ctx.beginPath();
      ctx.moveTo(bx + 9, by + 9);
      ctx.lineTo(bx + 1, by + 12);
      ctx.lineTo(bx + 9, by + 14);
      ctx.closePath();
      ctx.fill();

      // Eye
      ctx.fillStyle = "#FFFFFF";
      ctx.beginPath();
      ctx.arc(bx + 7, by + 11, 1.2, 0, Math.PI * 2);
      ctx.fill();

      // Wings
      ctx.fillStyle = "#0F172A";
      ctx.strokeStyle = "#0F172A";
      ctx.lineWidth = 2.4;

      if (flapFrame === 0) {
        // Wings UP
        ctx.beginPath();
        ctx.moveTo(bx + 14, by + 10);
        ctx.lineTo(bx + 11, by + 2);
        ctx.lineTo(bx + 19, by + 4);
        ctx.lineTo(bx + 22, by + 10);
        ctx.closePath();
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(bx + 18, by + 9);
        ctx.lineTo(bx + 17, by + 4);
        ctx.lineTo(bx + 23, by + 6);
        ctx.stroke();
      } else {
        // Wings DOWN
        ctx.beginPath();
        ctx.moveTo(bx + 14, by + 12);
        ctx.lineTo(bx + 11, by + 20);
        ctx.lineTo(bx + 19, by + 18);
        ctx.lineTo(bx + 22, by + 12);
        ctx.closePath();
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(bx + 18, by + 13);
        ctx.lineTo(bx + 17, by + 18);
        ctx.lineTo(bx + 23, by + 16);
        ctx.stroke();
      }

      // Tail
      ctx.beginPath();
      ctx.moveTo(bx + 31, by + 10);
      ctx.lineTo(bx + 36, by + 8);
      ctx.moveTo(bx + 31, by + 12);
      ctx.lineTo(bx + 36, by + 14);
      ctx.stroke();

      ctx.restore();
    }

    // Main Game Loop (Normalized 60 FPS frameScale)
    function gameLoop(timestamp) {
      if (!lastTime) lastTime = timestamp;
      const frameScale = Math.min(2.5, Math.max(0.2, (timestamp - lastTime) / (1000 / 60)));
      lastTime = timestamp;

      // Update
      if (gameState === "RUNNING") {
        speed = Math.min(MAX_SPEED, INITIAL_SPEED + score * ACCELERATION);
        distance += speed * frameScale;
        score = Math.floor(distance / 10);
        scoreVal.textContent = score;
        speedIndicator.textContent = `SPEED: ${(speed / INITIAL_SPEED).toFixed(1)}x`;

        // Milestone Chime Trigger every 100 points
        const currentMilestone = Math.floor(score / 100);
        if (currentMilestone > lastFactMilestone && currentMilestone > 0) {
          lastFactMilestone = currentMilestone;
          playTone('milestone');
        }

        // High Score
        if (score > highScore) {
          highScore = score;
          highScoreVal.textContent = highScore;
          try {
            localStorage.setItem(STORAGE_KEY_HIGH_SCORE, highScore.toString());
          } catch (e) {}
        }

        // Player physics with absolute ground-pinning guarantee
        if (!player.isGrounded) {
          const currentGravity = player.isDucking ? GRAVITY * 1.5 : GRAVITY;
          player.vy += currentGravity * frameScale;
          player.y += player.vy * frameScale;

          if (player.y >= GAME_GROUND_Y) {
            player.y = GAME_GROUND_Y;
            player.vy = 0;
            player.isGrounded = true;

            for (let i = 0; i < 4; i++) {
              particles.push({
                x: player.x + 8 + (Math.random() * 8 - 4),
                y: GAME_GROUND_Y,
                vx: -(Math.random() * 2 + 1),
                vy: -(Math.random() * 1.5),
                alpha: 0.6,
                size: Math.random() * 3 + 1,
                color: "#94A3B8"
              });
            }
          }
        } else {
          player.y = GAME_GROUND_Y;
          player.vy = 0;
        }

        // Dust while running on ground
        if (player.isGrounded && Math.random() < 1 - Math.pow(0.75, frameScale)) {
          particles.push({
            x: player.x + (player.isDucking ? -5 : 4),
            y: GAME_GROUND_Y - 2,
            vx: -(speed * 0.4 + Math.random() * 1.5),
            vy: -(Math.random() * 1.2),
            alpha: 0.5,
            size: Math.random() * 2.5 + 1.5,
            color: "#CBD5E1"
          });
        }

        // Spawn obstacles: Ground Hurdles, Books & Flying Birds
        if (distance >= nextSpawnDistance) {
          let obsType = "ground_hurdle";
          let obsW = 24;
          let obsH = 38;
          let obsY = GAME_GROUND_Y - obsH;

          if (score < 30) {
            const isHurdle = Math.random() > 0.5;
            obsType = isHurdle ? "ground_hurdle" : "ground_books";
            obsW = isHurdle ? 24 : 32;
            obsH = isHurdle ? 38 : 42;
            obsY = GAME_GROUND_Y - obsH;
          } else {
            const rand = Math.random();
            if (rand < 0.35) {
              obsType = "ground_hurdle";
              obsW = 24;
              obsH = 38;
              obsY = GAME_GROUND_Y - obsH;
            } else if (rand < 0.55) {
              obsType = "ground_books";
              obsW = 32;
              obsH = 42;
              obsY = GAME_GROUND_Y - obsH;
            } else if (rand < 0.75) {
              obsType = "bird_mid";
              obsW = 36;
              obsH = 22;
              obsY = GAME_GROUND_Y - 58; // Mid-height: DUCK to pass
            } else if (rand < 0.90) {
              obsType = "bird_low";
              obsW = 36;
              obsH = 22;
              obsY = GAME_GROUND_Y - 26; // Low-height: JUMP to clear
            } else {
              obsType = "bird_high";
              obsW = 36;
              obsH = 22;
              obsY = GAME_GROUND_Y - 76; // High-height: Run underneath
            }
          }

          obstacles.push({
            x: GAME_CANVAS_WIDTH + 20,
            y: obsY,
            width: obsW,
            height: obsH,
            type: obsType
          });

          // Fair distance scaling
          const minGap = Math.max(MIN_GAP, speed * 58);
          nextSpawnDistance = distance + minGap + 130 + Math.random() * 140;
        }

        // Update obstacles & check collisions
        const pBox = player.isDucking
          ? { x: player.x - 2, y: player.y - 22, w: 32, h: 22 }
          : { x: player.x + 3, y: player.y - 50, w: 18, h: 50 };

        for (let i = obstacles.length - 1; i >= 0; i--) {
          const obs = obstacles[i];
          obs.x -= speed * frameScale;

          // Fair AABB collision detection with 3px grace margin
          if (
            pBox.x + 3 < obs.x + obs.width - 3 &&
            pBox.x + pBox.w - 3 > obs.x + 3 &&
            pBox.y + 3 < obs.y + obs.height - 3 &&
            pBox.y + pBox.h - 3 > obs.y + 3
          ) {
            gameState = "GAMEOVER";
            playTone('crash');

            for (let c = 0; c < 25; c++) {
              particles.push({
                x: player.x + 12,
                y: player.y - 26,
                vx: (Math.random() - 0.5) * 10,
                vy: (Math.random() - 0.5) * 10,
                alpha: 1.0,
                size: Math.random() * 4 + 2,
                color: "#EF4444"
              });
            }
            break;
          }

          if (obs.x + obs.width < -30) {
            obstacles.splice(i, 1);
          }
        }
      }

      // Render
      ctx.fillStyle = "#F8FAFC";
      ctx.fillRect(0, 0, GAME_CANVAS_WIDTH, GAME_CANVAS_HEIGHT);

      // In-Game HUD: Speed at top-left, Score & Best at top-right
      ctx.fillStyle = "#0F172A";
      ctx.font = "bold 15px monospace";
      ctx.textAlign = "right";
      const scoreStr = String(score).padStart(5, "0");
      const highStr = String(highScore).padStart(5, "0");
      ctx.fillText(`SCORE: ${scoreStr}`, GAME_CANVAS_WIDTH - 25, 32);

      ctx.fillStyle = "#64748B";
      ctx.font = "12px monospace";
      ctx.fillText(`BEST:  ${highStr}`, GAME_CANVAS_WIDTH - 25, 50);

      ctx.textAlign = "left";
      ctx.fillStyle = "#64748B";
      ctx.font = "11px monospace";
      ctx.fillText(`SPEED: ${(speed / INITIAL_SPEED).toFixed(1)}x`, 25, 32);

      // Ground Line
      ctx.strokeStyle = '#1E293B';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(0, GAME_GROUND_Y);
      ctx.lineTo(GAME_CANVAS_WIDTH, GAME_GROUND_Y);
      ctx.stroke();

      // Moving ground ticks
      const tickOffset = (distance % 30);
      ctx.strokeStyle = 'rgba(100, 116, 139, 0.4)';
      ctx.lineWidth = 1.5;
      for (let x = -tickOffset; x < GAME_CANVAS_WIDTH; x += 30) {
        ctx.beginPath();
        ctx.moveTo(x, GAME_GROUND_Y + 4);
        ctx.lineTo(x + 12, GAME_GROUND_Y + 4);
        ctx.stroke();
      }

      // Draw obstacles
      for (const obs of obstacles) {
        if (obs.type === "ground_hurdle") {
          ctx.fillStyle = "#0F172A";
          ctx.beginPath();
          ctx.rect(obs.x, obs.y, obs.width, 7);
          ctx.fill();
          ctx.fillRect(obs.x + 2, obs.y + 7, 3, obs.height - 7);
          ctx.fillRect(obs.x + obs.width - 5, obs.y + 7, 3, obs.height - 7);
          ctx.fillRect(obs.x, obs.y + obs.height - 2, 7, 2);
          ctx.fillRect(obs.x + obs.width - 7, obs.y + obs.height - 2, 7, 2);
        } else if (obs.type === "ground_books") {
          const bookHeight = obs.height / 3;
          for (let b = 0; b < 3; b++) {
            const by = obs.y + b * bookHeight;
            const bw = obs.width - (b === 1 ? 4 : 0);
            const bx = obs.x + (b === 1 ? 2 : 0);
            ctx.fillStyle = "#0F172A";
            ctx.fillRect(bx, by, bw, bookHeight - 2);
            ctx.fillStyle = "#FFFFFF";
            ctx.fillRect(bx + 2, by + 2, 2, bookHeight - 6);
          }
        } else if (obs.type.startsWith("bird_")) {
          drawBird(obs, timestamp);
        }
      }

      // Draw stickman
      drawStickman(player, timestamp, distance);

      // Draw particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.x += pt.vx * frameScale;
        pt.y += pt.vy * frameScale;
        pt.alpha -= 0.025 * frameScale;
        if (pt.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }
        ctx.fillStyle = pt.color || "#94A3B8";
        ctx.globalAlpha = Math.max(0, pt.alpha);
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
      }

      // Game Over overlay
      if (gameState === "GAMEOVER") {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.82)';
        ctx.fillRect(0, 0, GAME_CANVAS_WIDTH, GAME_CANVAS_HEIGHT);

        ctx.fillStyle = '#EF4444';
        ctx.font = 'bold 28px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', GAME_CANVAS_WIDTH / 2, GAME_CANVAS_HEIGHT / 2 - 40);

        ctx.fillStyle = '#FFFFFF';
        ctx.font = 'bold 16px monospace';
        ctx.fillText(`SCORE: ${score}   |   BEST: ${highScore}`, GAME_CANVAS_WIDTH / 2, GAME_CANVAS_HEIGHT / 2 - 5);

        ctx.fillStyle = '#E2E8F0';
        ctx.font = '13px monospace';
        ctx.fillText('Press SPACE, R, or Tap to Restart', GAME_CANVAS_WIDTH / 2, GAME_CANVAS_HEIGHT / 2 + 46);
      }

      animFrame = requestAnimationFrame(gameLoop);
    }

    // Start immediately
    animFrame = requestAnimationFrame(gameLoop);

    // --- 3. Connectivity Detection ---
    async function checkConnectivity() {
      if (navigator.onLine) {
        try {
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 2500);
          const res = await fetch('/api/v1/health', { method: 'GET', cache: 'no-store', signal: controller.signal });
          clearTimeout(timer);
          if (res.ok) {
            document.getElementById('onlineBanner').style.display = 'flex';
          }
        } catch (e) {
          document.getElementById('onlineBanner').style.display = 'flex';
        }
      }
    }
    window.addEventListener('online', checkConnectivity);
    window.addEventListener('offline', () => {
      document.getElementById('onlineBanner').style.display = 'none';
    });
    if (navigator.onLine) {
      document.getElementById('onlineBanner').style.display = 'flex';
    }

    function dismissOnlineBanner() {
      document.getElementById('onlineBanner').style.display = 'none';
    }
  </script>
</body>
