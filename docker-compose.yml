version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: flashfacts-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flashfacts
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d flashfacts" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: flashfacts-redis
    restart: always
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flashfacts-api
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/flashfacts
      REDIS_URL: redis://redis:6379/0
      APP_ENV: production
      CORS_ORIGINS: '["*"]'
      INGESTION_ENABLED: "true"
      INGESTION_INTERVAL_MINUTES: "30"
      INGESTION_FRESHNESS_HOURS: "72"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
